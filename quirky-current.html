<!--

 Quirky, the 1-file text parser written in JS.
=====================================
Will open multiple xml/html/binary files to
sort/filter/.. the data into one column.
Being designed for mixed data representation,
will seek for qualified timestamps in xml feeds
(will not correct absent, partial, non-standart or represented with national calendar feed dates for now).
As it fully depends on browser features, input
compatibility may vary. As it just a parser, or
even wrapper, it's features are unstable.
Except these notices it is compatible with text
or binaries less or more. It can be extended to
support any input/task context processing.

Support:
 - news feeds (rss, rdf, atom) as xml;
 - t.me (chan web pages) as html;

Partial support:
 - ukrnet, suspilne, blackseanews as html/json;

Optional support (browser specific):
 - images:  jpeg, png, gif, webp;
 - audio: wav, mp3, mp4, flac, ogg;

 - speechSynthesis;

!-->

                 printable jpg form;

                 as in feed(), htm(), opts.dev=3;

 keep       also export original within translation;
 fft            fast Fourier transform audio settings,
                 will fail on long audios;

                1: show all input files in hex ;
                2: replace what/with and export;
                3: extract feed links and export;
                4: extract deflated streams from pdf.*/

const filters = {w:0, b:0}; const opts = {raw:1, max:1, img:1, tts:0, aux:0, bg:2, tran:0, dev:3, self:1, fft:0}; const tran = {orig:0, langs: "en,uk,de"}; const tts = {time:1, date:0, timedate:0, is:""}; const fft = {size: 32768, dbmin: -110, dbmax: -10, mic:0, file:1}; const saveto = {base64:0, jpg:0}; var jpgset;

 fftlog2   - - suspect fix;

const cloud = gid("cloud"); const dbg = gid("dbg"); const box = gid("box"); const trbox = gid("trbox"); const getf = gid("getf"); const buf = gid("buf"); const open = gid("open"); const w2 = gid("w2"); const w3 = gid("w3"); const drawbg = gid("drawbg"); const drawtxt = gid("drawtxt"); const audio = gid("audio"); const aquit = gid("aquit"); const fftF = gid("fftF"); const hide = "hide"; const body = gt("body")[0]; const fftL = gid("fftL"); const acur = gid("acur"); const aplay = gid("aplay"); const aplayer = gid("aplayer"); const acontrol = gid("acontrol");  const aseek = gid("aseek"); const adur = gid("adur"); const optbox = gid("optbox"); const features = gid("features"); const input = gid("input"); const search = gid("search");

/* Strings

 def          textual files signatures;
 e0, er      custom error warnings;
 mime     compatible mime types;

const e0 = "\nНемає файлів/записів\nщо відповідають "; const er = {r0:"!file\n", r1:"!rss\n", r2:"!tg\n", r3:"!un\n", r4: e0 +"умовам!", r5:"!ko\n", r6:"!su\n", r7:"!bs\n", r8:"!size = 0", r9:"!size > 24M", r10:"!atom\n", r11:"!rdf\n", r12: e0 + "фільтру!"}; const mime = {txt:"text/plain", html:"text/html", xml:"text/xml", jpg:"image/jpeg", png:"image/png", gif:"image/gif", mp4:"video/mp4", webm:"video/webm", mp3:"audio/mpeg", flac:"audio/flac", ogg:"audio/ogg", wav:"audio/wave", webp:"image/webp", pdf:"application/pdf"}; const def = {at:"<feed", bs:"blackseanews.net/all", un:"nt=\"UkrNet", ko:"щены. «ХЕРСОН О", rdf:"<rdf:RD", su:"nt=\"https://suspilne.media", htm:"<html", n4:"norma4tech", ab:"ABYZ News Links", tg:"t=\"Telegram\"", glos:"quirky-glossary"};

/* Substitutions (item means one record)

const sym1 = sc(65533); const sym2 = sc(8); const br ="<br>"; const br2 ="<br><br>"; const sciss = "<a id=\"scsxx\" class=\"sciss\"> ✂</a>";
const aw = " <a class=\"globo\" href=\"";
const ae = "\" target=\"_blank\"></a>";
const pc = "<p class=";
const pd = pc + "\"d\">";
const pe = "\">";
const ps = pc + "\"m";
const pt = ps + "\" id=\"spc\" onclick=\"if (opts.tran==1) dc(gid(\'trspc\'),hide); if (tts.is) {if (gid(\'scsxx\')) {ac(gid(\'ctxx\'),hide); dc(gid(\'scsxx\'),hide); gid(\'spc\').scrollIntoView({behavior: \'smooth\'});}; despk(); return} gid(\'spc\').scrollIntoView({behavior: \'smooth\'}); if (gid(\'scsxx\')) {dc(gid(\'ctxx\'),hide); ac(gid(\'scsxx\'),hide)} spk(\'spc\');\">";
const pg = "<p class=\"hide mm notranslate\" id=\"trspc\" onclick=\"if (tts.is) despk(); spk(\'trspc\'); tts.is=1;\">";
const pb = "<p><img src=\"";
const pr = ps + " reply notranslate\" id=\"shw\" onclick=\"gid(\'shw\').innerHTML=\'";
const pv = ps + " up2 reply notranslate\"";
const pi = ps + " up3 reply notranslate\"";
const pq = "\';\">";

const pf = pc + "\"bflog" + pe;

 isErr           error bi-state for w3;

 iAll              number of files to process;
 iDone         - - processed;
 iarr             array of html results;
 darr            - -  dates, to sort iarr/tarr;

                     to avoid text operations on them;

 YY..             time & date set by now().*/

var isErr = 0; var idx = -1; var iDone = 0; var iAll;
var iarr = []; var darr = []; var tarr = []; var parr=[]; var tsx, tex; var intervalbg; const wx = screen.width; const hx = screen.height; const pics = mime.jpg + mime.png + mime.webp + mime.gif; const vids = mime.mp4 + mime.webm; const auds = mime.mp3 + mime.flac + mime.wav + mime.ogg + "audio/mp4"; const txts = mime.xml + mime.html; var binmode=0; var YY, MM, DD, hh, mm, ss, ms; const context = getcontext(); var framefft; var fftresult=[]; var slocale;

/* Objects

const cx = new AudioContext();
const ax = cx.createAnalyser();
const filter = cx.createBiquadFilter();
ax.fftSize = fft.size;

var bx;
const voices = speechSynthesis.getVoices();
const speechRecognition = SpeechRecognition;
const spr = new SpeechRecognition();
spr.lang = "en-US";
spr.maxAlternatives = 1;
spr.continuous = false;
spr.interimResults = true;
const dec1= new TextDecoder("utf-8");
const dec2= new TextDecoder("windows-1251");
const dec3= new TextDecoder("GBK");
const dec4= new TextDecoder("windows-1256");

 /* Filters

 Rule syntax:     str1+str2-str3-str4;
 - - logic:             str1 && str2 && !str3 && !str4;

 - - order:            wF then bF;
 wF/bF:               "Yes"/"Not" filter's rules;

                             when filters.b==1!;

const wF = "херсон".split("|");
const bF = "changeme".split("|");
const tF = "дрон".split("|");

window.onload   on startup;
getf.onchange    on files input*/

window.onload = () => {
despk(); ico(); now();
if (opts.aux==1) octave();

speechSynthesis.cancel(); tts.is=""};

if (tran.orig==1) sw7.checked=true;
slocale = navigator.language || navigator.userLanguage}

drawbg.onclick = fixbg;

if (sw1.checked && opts.tran!=1) {
opts.tran=1; twidget()}}

if (sw2.checked) opts.tts=1}

if (sw5.checked) filters.w=1}

/* Gestures:

 Tap double:  - magnify text content;
 Tap single:   - item's main: tts read/stop;
                        - item's main: show "cutted" text;
                        - item's main: scrollinto;

document.ondblclick = magnify;
document.ontouchstart = (e) => {tsx=tx(e)}
document.ontouchend= (e) => {tex=tx(e);
if (tex<tsx-260) ftags();
if (tex>tsx+240) {

var s, str, img, lines, y; box.innerHTML="";

/* Main functions:

                   web pages, export as bash file;

                   binita (mixed files) or finita (textual);

                    (for texts tarr value not defined)

                   then sort iarr/tarr by darr
                   (items by date, types by date)
